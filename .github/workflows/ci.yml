name: Mi primer workflow

on:
  pull_request:
    branches:
      - main
  push:
    branches: [ "main" ]

jobs:
  comprobar_sintaxis:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      
      - name: Configurar python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: python -m py_compile calculadora.py

  pruebas:
    needs: comprobar_sintaxis
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: python -m pip install pytest

      - name: Ejecutar tests
        run: python -m pytest -v
    
  docker:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Construir imagen Docker
        run: docker build -t calculadora-tests:v1 .

      - name: Ejecutar contenedor Docker
        run: docker run --rm calculadora-tests:v1

  publicar_imagen:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen
        run: docker build -t ghcr.io/mburgos-dev/calculadora-tests:$IMAGE_TAG .

      - name: Publicar imagen en GHCR
        run: docker push ghcr.io/mburgos-dev/calculadora-tests:$IMAGE_TAG

      - name: Mostrar variable IMAGE_TAG
        run: echo "$IMAGE_TAG"
      
      - name: Construir imagen API
        run: docker build -f Dockerfile.api -t ghcr.io/${{ github.repository_owner }}/calculadora-api:$IMAGE_TAG .

      - name: Publicar imagen API en GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/calculadora-api:$IMAGE_TAG
